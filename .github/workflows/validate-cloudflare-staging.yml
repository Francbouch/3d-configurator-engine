name: Validate Cloudflare staging

on:
  push:
    branches: [migration/cloudflare-staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run validate-config
      - run: npm run build
      - name: Copy legacy fallback models into preview bundle
        run: |
          cp "CABINET TEST.glb" dist/
          cp "CUBES TEXTURES TEST.glb" dist/
      - name: Check live Cloudflare staging assets
        run: node scripts/smoke-cloudflare.mjs
      - name: Upload staging preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-staging-preview
          path: dist/
          retention-days: 7
