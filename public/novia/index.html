<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f8f6">
<title>Novia — Digital Studio</title>
<meta name="description" content="Novia est un studio de création digitale spécialisé dans les sites internet interactifs et contemporains.">
<style>
:root{--bg:#f8f8f6;--ink:#101010;--soft:#777}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}header{position:fixed;z-index:5;top:0;left:0;width:100%;height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 3.3vw;background:linear-gradient(var(--bg) 70%,transparent)}
.logo{font-size:18px;font-weight:600;letter-spacing:-.045em}.logo span{font-weight:400;color:#8b8b87;margin-left:5px}
nav{display:flex;align-items:center;gap:34px;font-size:13px}.contact{border-bottom:1px solid #111;padding-bottom:3px}
main{min-height:100svh}.hero{height:100svh;min-height:650px;padding:110px 3.3vw 4.2vw;display:flex;flex-direction:column;justify-content:space-between}
.topline{display:flex;justify-content:space-between;align-items:flex-start;color:#888;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.statement{width:min(1220px,94vw);font-size:clamp(54px,7.5vw,122px);line-height:.91;letter-spacing:-.07em;font-weight:400;margin:0}
.statement em{font-style:normal;color:#6f706d}.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:30px}.desc{font-size:15px;line-height:1.45;max-width:350px;margin:0}.scroll{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#888}
.projects{padding:150px 3.3vw 90px;min-height:100svh;background:#111;color:#f6f6f2}.project-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #ffffff2b;padding-bottom:18px;margin-bottom:90px}.project-head h2{font-size:13px;text-transform:uppercase;letter-spacing:.11em;font-weight:400;margin:0}.project-head span{font-size:11px;color:#888}
.project{display:grid;grid-template-columns:70px 1fr auto;align-items:center;padding:32px 0;border-bottom:1px solid #ffffff2b;transition:padding .25s}.project:hover{padding-left:12px}.project .n{font-size:11px;color:#777}.project h3{font-size:clamp(36px,5vw,76px);font-weight:400;letter-spacing:-.055em;margin:0}.project .type{font-size:12px;color:#888}
.placeholder{color:#777}.footer{padding-top:110px;display:flex;justify-content:space-between;align-items:end;color:#777;font-size:11px}.footer strong{font-size:clamp(32px,5vw,70px);font-weight:400;color:#f6f6f2;letter-spacing:-.05em}
.reveal{opacity:0;transform:translateY(14px);animation:in .8s .1s cubic-bezier(.2,.7,.2,1) forwards}@keyframes in{to{opacity:1;transform:none}}
@media(max-width:700px){header{height:78px;padding:0 20px}.logo span{display:none}nav{gap:20px}.hero{padding:95px 20px 26px;min-height:620px}.topline span:last-child{display:none}.statement{font-size:clamp(51px,16vw,76px);width:100%}.bottom{align-items:flex-end}.desc{font-size:13px;max-width:260px}.projects{padding:100px 20px 50px}.project-head{margin-bottom:55px}.project{grid-template-columns:34px 1fr}.project .type{display:none}.project h3{font-size:42px}.footer{padding-top:90px;flex-direction:column;align-items:flex-start;gap:24px}}
</style>
</head>
<body>
<header><a class="logo" href="#">NOVIA <span>Digital Studio</span></a><nav><a href="#projets">Nos projets</a><a class="contact" href="mailto:noviadigitalstudio@gmail.com">Contact</a></nav></header>
<main>
<section class="hero">
<div class="topline reveal"><span>Québec · Canada</span><span>Studio de création digitale</span></div>
<h1 class="statement reveal">Nous créons des<br>expériences digitales<br><em>qui avancent.</em></h1>
<div class="bottom reveal"><a class="scroll" href="#projets">Nos projets ↓</a></div>
</section>
<section class="projects" id="projets">
<div class="project-head"><h2>Nos projets</h2><span>Sélection</span></div>
<a class="project" href="../" target="_blank"><span class="n">01</span><h3>Configurateur 3D</h3><span class="type">Expérience interactive ↗</span></a>
<div class="project placeholder"><span class="n">02</span><h3>À venir</h3><span class="type">—</span></div>
<div class="footer"><strong>NOVIA.</strong><span>© 2026 — Digital Studio</span></div>
</section>
</main>
</body></html>
